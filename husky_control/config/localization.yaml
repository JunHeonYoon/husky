ekf_node:
  ros__parameters:
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    two_d_mode: true

    frequency: 50.0
    publish_tf: false

    # slip model: odom is trusted only for linear velocity, yaw rate is excluded because slip makes it inaccurate
    odom0: odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_queue_size: 10

    # Use yaw rate only from ZUPT-corrected IMU (roll/pitch orientation unnecessary in 2D)
    imu0: /imu/data_zupt
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true
